name: Sync Amazon Products

# ─── Cuándo se ejecuta ────────────────────────────────────────────────────────
#
#  • Se ejecuta de forma automática todos los días a las 05:00 UTC (07:00 en España).
#  • También se puede lanzar manualmente desde la pestaña Actions en GitHub.
#
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# ─── Permisos necesarios para hacer push del products.json actualizado ────────
permissions:
  contents: write

jobs:
  sync:
    name: Scrape wishlists & commit catalog
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Ejecuta el script de sync
      - name: Run Wishlists scraper sync
        run: node scripts/sync-wishlists.mjs

      # 4. Comprueba si hay cambios en products.json
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/products.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      # 5. Si hay cambios, hace commit → Vercel se redespliega automáticamente
      - name: Commit updated catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/products.json
          git commit -m "chore: sync Amazon wishlist catalog $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: No changes detected
        if: steps.changes.outputs.changed != 'true'
        run: echo "products.json sin cambios — no se hace commit."
